name: Rīta atjauninājums (VolleyballLife)

on:
  schedule:
    - cron: "15 2 * * *"   # katru dienu 02:15 UTC (05:15 Rīgā vasaras laikā, 04:15 ziemā)
    - cron: "15 14-23/3,5 * * 5,6,0,1"   # turnīru dienās (pk–sv, pirmd. rīts): ik pēc 3 h ASV dienā, lai rezultāti parādās jau spēļu laikā
  workflow_dispatch: {}     # poga "Run workflow" GitHub lapā

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Atjaunināt data.json no VolleyballLife
        run: |
          cp data.json .old.json
          python3 update.py data.json
          # ja atjauninājums ievieš JAUNU check.py kļūdu, kļūdainos datus nepublicē (2026-11-08: Runces vieta atgriezās)
          python3 check.py .old.json --json > .old_check.json || true
          python3 check.py data.json --json > .new_check.json || true
          python3 -c "import json,sys; o=set(json.load(open('.old_check.json'))['errors']); n=set(json.load(open('.new_check.json'))['errors']); new=n-o; [print('JAUNA KĻŪDA:', e) for e in new]; sys.exit(1 if new else 0)" || { cp .old.json data.json; rm -f .old.json .old_check.json .new_check.json; exit 1; }
          rm -f .old.json .old_check.json .new_check.json
      - name: Saglabāt izmaiņas
        run: |
          git config user.name "asvsmiltis-bot"
          git config user.email "mareks-voley@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then echo "Nav izmaiņu"; exit 0; fi
          git commit -m "Automātisks atjauninājums $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Pārbaudīt datus (check.py)
        run: python3 check.py data.json
